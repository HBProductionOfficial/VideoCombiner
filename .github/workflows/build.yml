name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            render: true
          - os: ubuntu-latest
            name: linux-x64
            render: true
          # No render test here. Installing ffmpeg through Homebrew pulls a long
          # dependency chain, and the POSIX code path this would exercise is the
          # same one the Linux job already covers.
          - os: macos-latest
            name: macos-arm64
            render: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVIDEOCOMBINER_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p dist
          # Multi-config generators put binaries in a subfolder, single-config
          # does not, so search rather than assume.
          find build -type f \
            \( -name 'videocombiner' -o -name 'videocombiner.exe' -o -name 'videocombiner-gui.exe' \) \
            -exec cp {} dist/ \;
          ls -la dist
          if [ -z "$(ls -A dist)" ]; then
            echo "no binaries were produced"
            exit 1
          fi

      - name: Smoke test
        shell: bash
        run: |
          if [ -f dist/videocombiner.exe ]; then cli=dist/videocombiner.exe; else cli=dist/videocombiner; fi
          "$cli" --version
          "$cli" --help > /dev/null

      - name: Install ffmpeg
        if: matrix.render
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac

      # Builds real videos and inspects them. The unit test only covers the
      # combination maths, and every bug that has actually shipped was in this
      # path instead.
      - name: Render smoke test
        if: matrix.render
        shell: bash
        run: |
          if [ -f dist/videocombiner.exe ]; then cli=dist/videocombiner.exe; else cli=dist/videocombiner; fi
          bash tests/render_smoke.sh "$cli"

      - uses: actions/upload-artifact@v4
        with:
          name: videocombiner-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            chmod +x "$dir"/* || true
            (cd "$dir" && zip -r "../$name.zip" .)
          done
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
